name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "imgs/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialise with the release pipeline, which also deploys to Pages.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy-pages.yml
