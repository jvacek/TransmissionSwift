name: Stable Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  build-release:
    name: Build stable release
    uses: ./.github/workflows/release-pipeline.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
