name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs on new pushes to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (swift-format + prek)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install prek
        run: brew install prek

      - name: Cache prek hook env
        uses: actions/cache@v6
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: prek-${{ runner.os }}-

      - name: Run pre-commit hooks
        run: prek run --all-files --show-diff-on-failure

  test-packages:
    name: Test Swift packages
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package: [TransmissionRPC, TransmissionCore]
    steps:
      - uses: actions/checkout@v7

      - name: Cache SPM build
        uses: actions/cache@v6
        with:
          path: |
            Packages/${{ matrix.package }}/.build
            ~/Library/Developer/Xcode/DerivedData
          key: spm-${{ runner.os }}-${{ matrix.package }}-${{ hashFiles(format('Packages/{0}/Package.resolved', matrix.package)) }}
          restore-keys: spm-${{ runner.os }}-${{ matrix.package }}-

      - name: Test ${{ matrix.package }}
        working-directory: Packages/${{ matrix.package }}
        # The package directories don't exist until the first slice lands.
        # Skip gracefully so this workflow can be merged before the packages exist.
        run: |
          if [ ! -f Package.swift ]; then
            echo "Package not yet present — skipping."
            exit 0
          fi
          # -warnings-as-errors lives here, not in Package.swift: Xcode passes
          # -suppress-warnings to package dependencies, and the two flags conflict.
          swift test --enable-code-coverage -Xswiftc -warnings-as-errors

  build-app:
    name: Build & test macOS app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macos-26 is the deployment floor, xcode-27 is the current toolchain/OS.
    # xcode-27 is a public-preview image, so on PRs (pre-release work) its leg is
    # allowed to fail; on main — from which releases are cut — both legs must pass.
    continue-on-error: ${{ matrix.os == 'xcode-27' && github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, xcode-27]
    steps:
      - uses: actions/checkout@v7

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Cache DerivedData
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          # The image is part of the key: runner.os is "macOS" for both legs, so
          # without matrix.os they would share (and cross-contaminate) one cache.
          key: deriveddata-${{ runner.os }}-${{ matrix.os }}-${{ hashFiles('TransmissionSwift.xcodeproj/project.pbxproj') }}
          restore-keys: deriveddata-${{ runner.os }}-${{ matrix.os }}-

      - name: Show available simulators / SDKs
        run: xcodebuild -showsdks

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project TransmissionSwift.xcodeproj \
            -scheme TransmissionSwift \
            -configuration Debug \
            -destination 'platform=macOS' \
            build | xcbeautify --renderer github-actions

      - name: Test
        run: |
          set -o pipefail
          xcodebuild \
            -project TransmissionSwift.xcodeproj \
            -scheme TransmissionSwift \
            -destination 'platform=macOS' \
            test | xcbeautify --renderer github-actions

  app-intents:
    name: App Intents (AppIntentsTesting)
    # Opt-in: App Intents require the app and test runner signed with the same
    # development team, which a stock CI runner cannot do. Enable by setting a
    # repository variable APP_INTENTS_CI=1 and the signing secrets below:
    #   secrets.APP_INTENTS_CERT_P12_BASE64  - base64 of the Apple Development .p12
    #   secrets.APP_INTENTS_CERT_PASSWORD    - the .p12 password
    #   secrets.APP_INTENTS_KEYCHAIN_PASSWORD - any throwaway string
    # The job is skipped entirely when the variable is unset, so PRs/forks are
    # unaffected.
    if: ${{ vars.APP_INTENTS_CI == '1' }}
    # Same policy as the xcode-27 matrix leg: this lane depends on the Xcode 27
    # preview image and on a signing certificate that will eventually expire, so
    # it must not be able to block a PR — but it is enforced on main.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    runs-on: xcode-27  # Xcode 27 / macOS 27 image; AppIntentsTesting ships only there
    env:
      # xcodebuild forwards TEST_RUNNER_-prefixed vars to the runner with the
      # prefix stripped; the test reads TRANSMISSION_APPINTENTS.
      TEST_RUNNER_TRANSMISSION_APPINTENTS: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APP_INTENTS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APP_INTENTS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APP_INTENTS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -p codesigning -v

      - name: Run App Intents tests
        run: |
          set -o pipefail
          xcodebuild \
            -project TransmissionSwift.xcodeproj \
            -scheme TransmissionSwift \
            -destination 'platform=macOS' \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM=JK45236K44 \
            test -only-testing:TransmissionSwiftUITests/AppIntentsUITests \
            | xcbeautify --renderer github-actions
