name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs on new pushes to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (swift-format + prek)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install prek
        run: brew install prek

      - name: Cache prek hook env
        uses: actions/cache@v6
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: prek-${{ runner.os }}-

      - name: Run pre-commit hooks
        run: prek run --all-files --show-diff-on-failure

  test-packages:
    name: Test Swift packages
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package: [TransmissionRPC, TransmissionCore]
    steps:
      - uses: actions/checkout@v7

      - name: Cache SPM build
        uses: actions/cache@v6
        with:
          path: |
            Packages/${{ matrix.package }}/.build
            ~/Library/Developer/Xcode/DerivedData
          key: spm-${{ runner.os }}-${{ matrix.package }}-${{ hashFiles(format('Packages/{0}/Package.resolved', matrix.package)) }}
          restore-keys: spm-${{ runner.os }}-${{ matrix.package }}-

      - name: Test ${{ matrix.package }}
        working-directory: Packages/${{ matrix.package }}
        # The package directories don't exist until the first slice lands.
        # Skip gracefully so this workflow can be merged before the packages exist.
        run: |
          if [ ! -f Package.swift ]; then
            echo "Package not yet present — skipping."
            exit 0
          fi
          # -warnings-as-errors lives here, not in Package.swift: Xcode passes
          # -suppress-warnings to package dependencies, and the two flags conflict.
          swift test --enable-code-coverage -Xswiftc -warnings-as-errors

  build-app:
    name: Build & test macOS app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macos-26 is the deployment floor, xcode-27 is the current toolchain/OS.
    # xcode-27 is a public-preview image, so on PRs (pre-release work) its leg is
    # allowed to fail; on main — from which releases are cut — both legs must pass.
    continue-on-error: ${{ matrix.os == 'xcode-27' && github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, xcode-27]
    steps:
      - uses: actions/checkout@v7

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Cache DerivedData
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          # The image is part of the key: runner.os is "macOS" for both legs, so
          # without matrix.os they would share (and cross-contaminate) one cache.
          key: deriveddata-${{ runner.os }}-${{ matrix.os }}-${{ hashFiles('TransmissionSwift.xcodeproj/project.pbxproj') }}
          restore-keys: deriveddata-${{ runner.os }}-${{ matrix.os }}-

      - name: Show available simulators / SDKs
        run: xcodebuild -showsdks

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project TransmissionSwift.xcodeproj \
            -scheme TransmissionSwift \
            -configuration Debug \
            -destination 'platform=macOS' \
            build | xcbeautify --renderer github-actions

      - name: Test
        run: |
          set -o pipefail
          xcodebuild \
            -project TransmissionSwift.xcodeproj \
            -scheme TransmissionSwift \
            -destination 'platform=macOS' \
            test | xcbeautify --renderer github-actions

  app-intents:
    name: App Intents (AppIntentsTesting)
    # Informational in CI: it never blocks a PR or a push to main. It is enforced
    # only on the stable-release path (see release-pipeline.yml). Enable with the
    # repository variable APP_INTENTS_CI=1 and the signing secrets
    # (APP_INTENTS_CERT_P12_BASE64 / APP_INTENTS_CERT_PASSWORD /
    # APP_INTENTS_KEYCHAIN_PASSWORD); otherwise the job is skipped.
    if: ${{ vars.APP_INTENTS_CI == '1' }}
    uses: ./.github/workflows/app-intents.yml
    with:
      # Informational in CI: report failures but never block a PR or main push.
      # Enforced on the stable-release path (see release-pipeline.yml).
      allow-failure: true
    secrets: inherit
