name: CI

on:
  push:
    branches: [main]
  pull_request:

# Checkout is all the token is needed for; caches and artifacts use the
# runner's own token.
permissions:
  contents: read

# Cancel in-progress runs on new pushes to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (swift-format + prek)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Check MPL license headers
        run: python3 scripts/license_headers.py

      - name: Install prek
        run: brew install prek

      - name: Cache prek hook env
        uses: actions/cache@v6
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: prek-${{ runner.os }}-

      - name: Run pre-commit hooks
        run: prek run --all-files --show-diff-on-failure

  test-packages:
    name: Test Swift packages
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package: [TransmissionRPC, TorrentMetainfo, TransmissionCore]
    steps:
      - uses: actions/checkout@v7

      - name: Cache SPM build
        uses: actions/cache@v6
        with:
          path: |
            Packages/${{ matrix.package }}/.build
            ~/Library/Developer/Xcode/DerivedData
          key: spm-${{ runner.os }}-${{ matrix.package }}-${{ hashFiles(format('Packages/{0}/Package.resolved', matrix.package), format('Packages/{0}/Package.swift', matrix.package)) }}
          restore-keys: spm-${{ runner.os }}-${{ matrix.package }}-

      - name: Test ${{ matrix.package }}
        working-directory: Packages/${{ matrix.package }}
        # The package directories don't exist until the first slice lands.
        # Skip gracefully so this workflow can be merged before the packages exist.
        run: |
          if [ ! -f Package.swift ]; then
            echo "Package not yet present — skipping."
            exit 0
          fi
          # -warnings-as-errors lives here, not in Package.swift: Xcode passes
          # -suppress-warnings to package dependencies, and the two flags conflict.
          swift test --enable-code-coverage -Xswiftc -warnings-as-errors

  build-app:
    name: Build macOS app (xcode-27)
    # Built once with the newest SDK; the deployment target keeps it running on
    # macOS 26.1+. test-app then runs this exact build on each macOS major.
    runs-on: xcode-27
    timeout-minutes: 30
    # Unsigned on purpose: Debug has no DEVELOPMENT_TEAM, so it builds ad-hoc
    # and fork PRs (which get no secrets) pass. Only app-intents signs.
    steps:
      - uses: actions/checkout@v7

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Restore DerivedData
        # Saved per main commit (see "Save DerivedData"); PRs restore the newest.
        uses: actions/cache/restore@v6
        with:
          # Same paths as "Save DerivedData", or the cache version differs.
          path: |
            ~/Library/Developer/Xcode/DerivedData
            !~/Library/Developer/Xcode/DerivedData/*/Logs
          # The package graph is part of the key: restoring products built
          # against the previous Sentry/Sparkle revision leaves stale explicit
          # modules and headers behind, and the build then fails to import the
          # framework ("SDK is not supported by the compiler"). A dependency
          # bump therefore starts from a cold DerivedData.
          key: deriveddata-${{ runner.os }}-xcode-27-${{ hashFiles('TransmissionSwift.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: deriveddata-${{ runner.os }}-xcode-27-${{ hashFiles('TransmissionSwift.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-

      - name: Show available SDKs
        run: xcodebuild -showsdks

      # One compile: a plain `build` followed by `test` compiled everything twice,
      # because the test build uses different settings (coverage, testability).
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild \
            -project TransmissionSwift.xcodeproj \
            -scheme TransmissionSwift \
            -destination 'platform=macOS' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build-for-testing | xcbeautify --renderer github-actions

      - name: Save DerivedData
        # Only from main, so the cache follows main's build products. A key that
        # only changed with project.pbxproj went stale.
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          # Logs are not build products; restore and save must list the same
          # paths, or the cache version differs and every restore misses.
          path: |
            ~/Library/Developer/Xcode/DerivedData
            !~/Library/Developer/Xcode/DerivedData/*/Logs
          # Same key as "Restore DerivedData".
          key: deriveddata-${{ runner.os }}-xcode-27-${{ hashFiles('TransmissionSwift.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}

      - name: Package test products
        # tar, not the raw folder: artifact zips drop the frameworks' symlinks
        # and executable bits, which breaks the code signatures.
        run: |
          products=$(echo ~/Library/Developer/Xcode/DerivedData/TransmissionSwift-*/Build/Products)
          tar -C "$products" -cf TestProducts.tar .

      - uses: actions/upload-artifact@v7
        with:
          name: TestProducts
          path: TestProducts.tar
          retention-days: 1

  test-app:
    name: Test macOS app (${{ matrix.os }})
    needs: build-app
    # The latest image of each supported macOS major, running the one build.
    runs-on: ${{ matrix.os }}
    # A hung UI test would otherwise hold the runner for GitHub's 6-hour limit.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, xcode-27]
    steps:
      # The UI tests read their fixtures from the checkout, at the path the
      # build recorded; GitHub's macOS runners share that path.
      - uses: actions/checkout@v7

      - name: Install xcbeautify
        run: brew install xcbeautify

      - uses: actions/download-artifact@v8
        with:
          name: TestProducts

      - name: Unpack test products
        run: mkdir TestProducts && tar -C TestProducts -xf TestProducts.tar

      - name: Test
        env:
          # UI tests only on macos-26: Swift Testing comes from the runner's
          # Xcode (26.6), which can't load unit tests built with Xcode 27's test
          # macros. The unit tests don't depend on the OS; xcode-27 runs them.
          ONLY_TESTING: ${{ matrix.os == 'macos-26' && '-only-testing:TransmissionSwiftUITests' || '' }}
        run: |
          set -o pipefail
          # shellcheck disable=SC2086  # ONLY_TESTING is intentionally word-split.
          xcodebuild \
            -xctestrun TestProducts/*.xctestrun \
            -destination 'platform=macOS' \
            $ONLY_TESTING \
            -resultBundlePath TestResults.xcresult \
            test-without-building | xcbeautify --renderer github-actions

      - name: Upload test results
        # Crash logs and failure screenshots: UI failures on the runner's small
        # display don't reproduce locally.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults-${{ matrix.os }}
          path: TestResults.xcresult
          retention-days: 7

  app-intents:
    name: App Intents tests (xcode-27)
    # Its own job, so this compile-gated build runs alongside build-app instead
    # of after it. It must stay a separate build: the main test build must not
    # link AppIntentsTesting, or one bad host framework takes down every UI test.
    # Enforced on main; on PRs non-blocking. Needs the signing secrets, which
    # fork PRs don't get.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 30
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Restore DerivedData
        # Restore only: build-app saves this cache.
        uses: actions/cache/restore@v6
        with:
          # Same paths as "Save DerivedData", or the cache version differs.
          path: |
            ~/Library/Developer/Xcode/DerivedData
            !~/Library/Developer/Xcode/DerivedData/*/Logs
          key: deriveddata-${{ runner.os }}-xcode-27-${{ hashFiles('TransmissionSwift.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: deriveddata-${{ runner.os }}-xcode-27-${{ hashFiles('TransmissionSwift.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-

      - name: Check App Intents toolchain
        # AppIntentsTesting is a host framework; a mismatched Xcode/macOS pair
        # fails at bundle load. Fail here with a readable message instead.
        run: xcrun swift scripts/check_appintents_toolchain.swift

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APP_INTENTS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APP_INTENTS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APP_INTENTS_KEYCHAIN_PASSWORD }}
        run: scripts/ci_import_signing_cert.sh

      - name: App Intents tests
        env:
          # xcodebuild strips the TEST_RUNNER_ prefix when forwarding to the
          # runner, which reads TRANSMISSION_APPINTENTS.
          TEST_RUNNER_TRANSMISSION_APPINTENTS: "1"
        run: |
          set -o pipefail
          xcodebuild \
            -project TransmissionSwift.xcodeproj \
            -scheme TransmissionSwift \
            -destination 'platform=macOS' \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM=JK45236K44 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) APP_INTENTS_UI_TESTS' \
            test -only-testing:TransmissionSwiftUITests/AppIntentsUITests \
            | xcbeautify --renderer github-actions
