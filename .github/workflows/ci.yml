name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs on new pushes to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (swift-format + prek)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Check MPL license headers
        run: python3 scripts/license_headers.py

      - name: Install prek
        run: brew install prek

      - name: Cache prek hook env
        uses: actions/cache@v6
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: prek-${{ runner.os }}-

      - name: Run pre-commit hooks
        run: prek run --all-files --show-diff-on-failure

  test-packages:
    name: Test Swift packages
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package: [TransmissionRPC, TorrentMetainfo, TransmissionCore]
    steps:
      - uses: actions/checkout@v7

      - name: Cache SPM build
        uses: actions/cache@v6
        with:
          path: |
            Packages/${{ matrix.package }}/.build
            ~/Library/Developer/Xcode/DerivedData
          key: spm-${{ runner.os }}-${{ matrix.package }}-${{ hashFiles(format('Packages/{0}/Package.resolved', matrix.package), format('Packages/{0}/Package.swift', matrix.package)) }}
          restore-keys: spm-${{ runner.os }}-${{ matrix.package }}-

      - name: Test ${{ matrix.package }}
        working-directory: Packages/${{ matrix.package }}
        # The package directories don't exist until the first slice lands.
        # Skip gracefully so this workflow can be merged before the packages exist.
        run: |
          if [ ! -f Package.swift ]; then
            echo "Package not yet present — skipping."
            exit 0
          fi
          # -warnings-as-errors lives here, not in Package.swift: Xcode passes
          # -suppress-warnings to package dependencies, and the two flags conflict.
          swift test --enable-code-coverage -Xswiftc -warnings-as-errors

  build-app:
    name: Build & test macOS app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macos-26 is the deployment floor, xcode-27 is the current toolchain/OS.
    # xcode-27 is a public-preview image, so on PRs (pre-release work) its leg is
    # allowed to fail; on main — from which releases are cut — both legs must pass.
    continue-on-error: ${{ matrix.os == 'xcode-27' && github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, xcode-27]
    env:
      # The app and the UI-test runner must share a team for the AppIntentsTests
      # unit suite; xcode-27 is the only leg whose SDK runs it. Both the build
      # and the test step need it, or test-without-building finds no products.
      SIGNING_ARGS: ${{ matrix.os == 'xcode-27' && '-allowProvisioningUpdates DEVELOPMENT_TEAM=JK45236K44' || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Show available simulators / SDKs
        run: xcodebuild -showsdks

      - name: Import signing certificate
        # App Intents reject an unsigned (ad-hoc) app.
        if: matrix.os == 'xcode-27'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APP_INTENTS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APP_INTENTS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APP_INTENTS_KEYCHAIN_PASSWORD }}
        run: scripts/ci_import_signing_cert.sh

      # One compile: a plain `build` followed by `test` compiled everything twice,
      # because the test build uses different settings (coverage, testability).
      # No DerivedData cache either: a fresh checkout's timestamps invalidated
      # it, so restoring 1.2 GB still left a full rebuild.
      - name: Build for testing
        run: |
          set -o pipefail
          # shellcheck disable=SC2086  # SIGNING_ARGS is intentionally word-split.
          xcodebuild \
            -project TransmissionSwift.xcodeproj \
            -scheme TransmissionSwift \
            -destination 'platform=macOS' \
            $SIGNING_ARGS \
            build-for-testing | xcbeautify --renderer github-actions

      - name: Test
        run: |
          set -o pipefail
          # shellcheck disable=SC2086  # SIGNING_ARGS is intentionally word-split.
          xcodebuild \
            -project TransmissionSwift.xcodeproj \
            -scheme TransmissionSwift \
            -destination 'platform=macOS' \
            $SIGNING_ARGS \
            -resultBundlePath TestResults.xcresult \
            test-without-building | xcbeautify --renderer github-actions

      - name: Upload test results
        # Crash logs and failure screenshots: UI failures on the runner's small
        # display don't reproduce locally.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults-${{ matrix.os }}
          path: TestResults.xcresult
          retention-days: 7

  app-intents:
    name: App Intents tests (xcode-27)
    # Its own job, so this compile-gated build runs alongside build-app instead
    # of after it. It must stay a separate build: the main test build must not
    # link AppIntentsTesting, or one bad host framework takes down every UI test.
    # Enforced on main; on PRs non-blocking, like build-app's xcode-27 leg.
    runs-on: xcode-27
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Check App Intents toolchain
        # AppIntentsTesting is a host framework; a mismatched Xcode/macOS pair
        # fails at bundle load. Fail here with a readable message instead.
        run: xcrun swift scripts/check_appintents_toolchain.swift

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APP_INTENTS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APP_INTENTS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APP_INTENTS_KEYCHAIN_PASSWORD }}
        run: scripts/ci_import_signing_cert.sh

      - name: App Intents tests
        env:
          # xcodebuild strips the TEST_RUNNER_ prefix when forwarding to the
          # runner, which reads TRANSMISSION_APPINTENTS.
          TEST_RUNNER_TRANSMISSION_APPINTENTS: "1"
        run: |
          set -o pipefail
          xcodebuild \
            -project TransmissionSwift.xcodeproj \
            -scheme TransmissionSwift \
            -destination 'platform=macOS' \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM=JK45236K44 \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) APP_INTENTS_UI_TESTS' \
            test -only-testing:TransmissionSwiftUITests/AppIntentsUITests \
            | xcbeautify --renderer github-actions
