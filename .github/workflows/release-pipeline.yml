name: Release Pipeline

on:
  workflow_call:
    inputs:
      version:
        description: "Marketing version for a stable release (e.g. 1.0.0). Empty for pre-releases."
        type: string
        required: false
        default: ""
      prerelease:
        description: "Mark the GitHub release as a pre-release and use the beta Sparkle channel."
        type: boolean
        required: false
        default: false
    secrets:
      SPARKLE_PRIVATE_KEY:
        required: true

# Serialise with the Pages workflow, which also deploys the Pages site.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

env:
  # Public base URL the Pages site is served from; the appcast's release-notes
  # links point here. Switch to the custom domain once HTTPS is enforced.
  SITE_BASE_URL: https://jvacek.github.io/TransmissionSwift

jobs:
  app-intents:
    name: App Intents (AppIntentsTesting)
    # A stable release must pass the App Intents integration lane; a pre-release
    # tolerates a failure. Kill switch: unset the APP_INTENTS_CI repository
    # variable (the job is then skipped and the release proceeds).
    if: ${{ vars.APP_INTENTS_CI == '1' }}
    uses: ./.github/workflows/app-intents.yml
    with:
      # A stable release must pass the App Intents lane; a pre-release tolerates a
      # failure. Kill switch: unset the APP_INTENTS_CI repository variable (the
      # job is then skipped and the release proceeds).
      allow-failure: ${{ inputs.prerelease }}
    secrets: inherit

  build-release:
    name: Build and publish
    needs: app-intents
    runs-on: macos-26
    concurrency:
      # Serialize stable and pre-release runs: they all write the same
      # appcast, so concurrent runs could clobber each other.
      group: release-pipeline
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed for the git describe/tag lookup when generating pre-release notes.
          fetch-depth: 0

      - name: Verify default branch
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Releases are only published from main."
            exit 1
          fi

      - name: Validate version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must be in semver format (e.g. 1.0.0)"
            exit 1
          fi

      - name: Resolve release metadata
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          release_year="$(date -u +%Y)"
          release_month="$(date -u +%m)"
          release_day="$(date -u +%d)"
          release_month="${release_month#0}"
          release_day="${release_day#0}"

          # Append HHMMSS so same-day releases still get strictly increasing
          # build versions. Sparkle compares only the build version
          # (sparkle:version), so equal builds are never offered as an update.
          RELEASE_BUILD_VERSION="${release_year}.${release_month}.${release_day}.$(date -u +%H%M%S)"
          RELEASE_DATE="${release_year}-$(date -u +%m)-$(date -u +%d)"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          RELEASE_SHA="$(git rev-parse HEAD)"

          if [ "$PRERELEASE" = "true" ]; then
            # Per-day ordinal so several pre-releases on the same day sort by
            # number rather than by commit hash. Runs are serialised by the
            # release-pipeline concurrency group and the tag is only created at
            # the end, so the count never races another run.
            PRERELEASE_SEQ="$(printf '%02d' "$(( $(git tag -l "prerelease-${RELEASE_DATE}-*" | wc -l | tr -d ' ') + 1 ))")"
            TAG="prerelease-${RELEASE_DATE}-${PRERELEASE_SEQ}-${SHORT_SHA}"
            TITLE="Pre-release ${RELEASE_DATE} ${PRERELEASE_SEQ} (${SHORT_SHA})"
            APPCAST_TITLE="Pre-release ${RELEASE_DATE} (${PRERELEASE_SEQ})"
            SHORT_VERSION="0.1"
            CHANNEL="beta"
            PRERELEASE_FLAG="--prerelease"
            BUILD_EXTRA_FLAGS="SWIFT_ACTIVE_COMPILATION_CONDITIONS=PRERELEASE"
            ZIP_BASENAME="TransmissionSwift-${RELEASE_DATE}-${PRERELEASE_SEQ}-${SHORT_SHA}"
          else
            TAG="v${VERSION}"
            TITLE="TransmissionSwift ${VERSION}"
            APPCAST_TITLE="Version ${VERSION}"
            SHORT_VERSION="$VERSION"
            CHANNEL=""
            PRERELEASE_FLAG=""
            BUILD_EXTRA_FLAGS="MARKETING_VERSION=${VERSION}"
            ZIP_BASENAME="TransmissionSwift-${TAG}"
          fi

          ZIP_PATH="build/${ZIP_BASENAME}-universal.zip"
          ZIP_PATH_ARM64="build/${ZIP_BASENAME}-arm64.zip"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "TITLE=$TITLE" >> "$GITHUB_ENV"
          echo "APPCAST_TITLE=$APPCAST_TITLE" >> "$GITHUB_ENV"
          echo "SHORT_VERSION=$SHORT_VERSION" >> "$GITHUB_ENV"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "PRERELEASE_FLAG=$PRERELEASE_FLAG" >> "$GITHUB_ENV"
          echo "BUILD_EXTRA_FLAGS=$BUILD_EXTRA_FLAGS" >> "$GITHUB_ENV"
          echo "RELEASE_DATE=$RELEASE_DATE" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "RELEASE_BUILD_VERSION=$RELEASE_BUILD_VERSION" >> "$GITHUB_ENV"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "ZIP_PATH_ARM64=$ZIP_PATH_ARM64" >> "$GITHUB_ENV"
          echo "ZIP_FILENAME=$(basename "$ZIP_PATH")" >> "$GITHUB_ENV"
          echo "ZIP_FILENAME_ARM64=$(basename "$ZIP_PATH_ARM64")" >> "$GITHUB_ENV"

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Import signing certificate
        # App Intents refuse ad-hoc apps, so the shipped build must carry a team
        # identity. Reuses the same Apple Development certificate as the App
        # Intents test lane (APP_INTENTS_* secrets), passed down by the caller's
        # `secrets: inherit`.
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APP_INTENTS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APP_INTENTS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APP_INTENTS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -p codesigning -v

      - name: Build universal app
        run: |
          set -euo pipefail
          set -o pipefail

          xcodebuild \
            -project TransmissionSwift.xcodeproj \
            -scheme TransmissionSwift \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            CURRENT_PROJECT_VERSION="$RELEASE_BUILD_VERSION" \
            $BUILD_EXTRA_FLAGS \
            build | xcbeautify --renderer github-actions

      - name: Upload dSYMs to Sentry
        # Best-effort: add the SENTRY_AUTH_TOKEN secret to enable it; without it
        # the crash backend stays empty and the release proceeds. Upload before
        # signing so the dSYM is the one the compiler produced; symbolication
        # matches by build version. The DSN itself is baked into the app's
        # Release build settings, so no DSN is needed here.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: flamerelay
          SENTRY_PROJECT: transmissionswift
          SENTRY_URL: https://us.sentry.io
        run: |
          set -euo pipefail

          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "SENTRY_AUTH_TOKEN not set; skipping dSYM upload."
            exit 0
          fi

          brew install getsentry/tools/sentry-cli
          dSYM="build/DerivedData/Build/Products/Release/TransmissionSwift.app.dSYM"
          sentry-cli releases new "$RELEASE_BUILD_VERSION"
          sentry-cli debug-files upload "$dSYM"
          sentry-cli releases finalize "$RELEASE_BUILD_VERSION"

      - name: Sign, thin and zip bundles
        run: |
          set -euo pipefail

          app_path="build/DerivedData/Build/Products/Release/TransmissionSwift.app"
          if [ ! -d "$app_path" ]; then
            echo "Expected app bundle not found at ${app_path}."
            exit 1
          fi

          # Sign with the imported team identity — ad-hoc signatures make App
          # Intents unusable, which is the whole point of shipping them. Nested
          # code is signed with the same identity.
          IDENTITY="$(security find-identity -v -p codesigning \
            | sed -nE 's/.*"(Apple Development[^"]*)".*/\1/p' | head -1)"
          if [ -z "$IDENTITY" ]; then
            echo "No Apple Development signing identity found."
            exit 1
          fi
          echo "Signing with: $IDENTITY"

          # Release sandbox entitlements. The Release config derives these from
          # build settings at sign time (ENABLE_APP_SANDBOX etc.), but signing
          # is disabled above (CODE_SIGNING_ALLOWED=NO), so embed the equivalent
          # set explicitly here. Mirrors the Debug entitlements minus Debug-only
          # keys (get-task-allow, / read exception). The mach-lookup names need
          # the literal bundle id: raw codesign does not expand
          # $(PRODUCT_BUNDLE_IDENTIFIER).
          cat > build/Release.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.app-sandbox</key>
              <true/>
              <key>com.apple.security.files.downloads.read-only</key>
              <true/>
              <key>com.apple.security.files.user-selected.read-write</key>
              <true/>
              <key>com.apple.security.network.client</key>
              <true/>
              <key>com.apple.security.temporary-exception.mach-lookup.global-name</key>
              <array>
                  <string>jvacek.TransmissionSwift-spks</string>
                  <string>jvacek.TransmissionSwift-spki</string>
              </array>
          </dict>
          </plist>
          EOF

          # Seals a bundle: re-seal nested code inside-out first (the embedded
          # Sparkle framework ships a stale upstream seal — Xcode strips files
          # like PrivateHeaders at copy time, so its seal no longer matches
          # disk), then seal the outer app with the sandbox entitlements.
          # Without this the bundle has no _CodeSignature while the binary
          # carries a linker ad-hoc signature demanding sealed resources, and
          # Gatekeeper reports the app as damaged. The trailing verify is a
          # tripwire: it fails the run instead of shipping another damaged zip.
          seal_bundle() {
            local bundle="$1"
            find "$bundle" \( -name '*.app' -o -name '*.framework' -o -name '*.xpc' \) \
              | sort -r \
              | while IFS= read -r nested; do
                if [ "$nested" != "$bundle" ]; then
                  codesign --force --sign "$IDENTITY" --preserve-metadata=entitlements "$nested"
                fi
              done
            codesign --force --sign "$IDENTITY" --entitlements build/Release.entitlements "$bundle"
            codesign --verify --deep --strict --verbose=2 "$bundle"
          }

          # Universal zip, straight from the build.
          seal_bundle "$app_path"
          ditto -c -k --keepParent "$app_path" "$ZIP_PATH"

          # Arm64-only zip, thinned from the universal bundle so both zips
          # share the identical arm64 slice (one compile, no two-build drift).
          # Thinning invalidates binary signatures, so re-sign each thinned
          # binary (keeping its entitlements) before re-sealing the bundle.
          mkdir -p build/arm64
          cp -R "$app_path" build/arm64/
          arm_app="build/arm64/TransmissionSwift.app"
          find "$arm_app" -type f -perm +111 | while IFS= read -r f; do
            if lipo -info "$f" 2>/dev/null | grep -q "Architectures in the fat file"; then
              thin_out="$f.thin"
              lipo "$f" -thin arm64 -output "$thin_out" && mv "$thin_out" "$f"
              codesign --force --sign "$IDENTITY" --preserve-metadata=entitlements "$f"
            fi
          done
          seal_bundle "$arm_app"
          lipo -info "$arm_app/Contents/MacOS/TransmissionSwift"
          ditto -c -k --keepParent "$arm_app" "$ZIP_PATH_ARM64"

      - name: Verify release artifacts
        run: |
          set -euo pipefail

          # Re-verify the zipped artifacts, not just the build dirs, so a
          # broken seal or a bad ditto round-trip fails the run instead of
          # shipping. Gatekeeper triage from the 0.5.2 incident: a thin arm64
          # binary with only the linker's ad-hoc stub and no sealed resources
          # verifies as "code has no resources…" (Finder: damaged, no bypass),
          # while the fat binary verifies as "not signed at all" (Finder:
          # unverified developer, bypassable). Any verify failure here is the
          # damaged state — fail loudly.
          verify_artifact() {
            local zip="$1"
            local want="$2" # thin-arm64 | fat
            local work
            work="$(mktemp -d)"
            ditto -x -k "$zip" "$work"
            local app="$work/TransmissionSwift.app"
            if [ ! -d "$app/Contents/_CodeSignature" ]; then
              echo "$zip: missing _CodeSignature seal."
              exit 1
            fi
            codesign --verify --deep --strict --verbose=2 "$app"
            local archs
            archs="$(lipo -info "$app/Contents/MacOS/TransmissionSwift")"
            if [ "$want" = "thin-arm64" ]; then
              if ! echo "$archs" | grep -q "Non-fat file"; then
                echo "$zip: expected thin arm64 binary, got: $archs"
                exit 1
              fi
            else
              if ! echo "$archs" | grep -q "Architectures in the fat file"; then
                echo "$zip: expected universal binary, got: $archs"
                exit 1
              fi
            fi
            if ! echo "$archs" | grep -q "arm64"; then
              echo "$zip: arm64 slice missing: $archs"
              exit 1
            fi
            if ! codesign -d --entitlements :- "$app" 2>/dev/null | grep -q "com.apple.security.app-sandbox"; then
              echo "$zip: sandbox entitlements missing."
              exit 1
            fi
            # App Intents require a team identity; an ad-hoc release ships with
            # Shortcuts actions that can't reach the app (Code=800). Tripwire so
            # that class of broken release fails here instead of on a user's Mac.
            if codesign -dv "$app" 2>&1 | grep -q "TeamIdentifier=not set"; then
              echo "$zip: ad-hoc signed (no TeamIdentifier); App Intents will not work."
              exit 1
            fi
            echo "$zip: OK ($archs)"
            rm -rf "$work"
          }

          verify_artifact "$ZIP_PATH" fat
          verify_artifact "$ZIP_PATH_ARM64" thin-arm64

      - name: Install Sparkle tools
        run: |
          set -euo pipefail

          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/2.9.4/Sparkle-2.9.4.tar.xz" \
            -o /tmp/sparkle.tar.xz
          mkdir -p /tmp/sparkle
          tar xf /tmp/sparkle.tar.xz --strip-components=1 -C /tmp/sparkle
          echo "/tmp/sparkle/bin" >> "$GITHUB_PATH"

      - name: Sign zips
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          # --- Universal zip ---
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP_FILENAME}"
          sign_output=$(echo "$SPARKLE_PRIVATE_KEY" | sign_update \
            --ed-key-file - "$ZIP_PATH")
          signature=$(echo "$sign_output" | sed -n \
            's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          length=$(echo "$sign_output" | sed -n \
            's/.*length="\([^"]*\)".*/\1/p')

          echo "SIGNATURE=$signature" >> "$GITHUB_ENV"
          echo "ED_LENGTH=$length" >> "$GITHUB_ENV"
          echo "DOWNLOAD_URL=$download_url" >> "$GITHUB_ENV"

          # --- Arm64-only zip ---
          download_url_arm64="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP_FILENAME_ARM64}"
          sign_output_arm64=$(echo "$SPARKLE_PRIVATE_KEY" | sign_update \
            --ed-key-file - "$ZIP_PATH_ARM64")
          signature_arm64=$(echo "$sign_output_arm64" | sed -n \
            's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          length_arm64=$(echo "$sign_output_arm64" | sed -n \
            's/.*length="\([^"]*\)".*/\1/p')

          echo "SIGNATURE_ARM64=$signature_arm64" >> "$GITHUB_ENV"
          echo "ED_LENGTH_ARM64=$length_arm64" >> "$GITHUB_ENV"
          echo "DOWNLOAD_URL_ARM64=$download_url_arm64" >> "$GITHUB_ENV"

      - name: Generate release notes
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          mkdir -p build/appcast

          # Sparkle release notes = the full accumulated changelog, plus a live
          # copy for sparkle:fullReleaseNotesLink.
          cp CHANGELOG.md "build/appcast/release-notes-${TAG}.md"
          cp CHANGELOG.md "build/appcast/changelog.md"

          if [ "$PRERELEASE" = "true" ]; then
            # Pre-release GitHub notes: changes since the last tag.
            last_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            if [ -n "$last_tag" ]; then
              echo "# Changes since ${last_tag}" > build/changelog.md
              echo "" >> build/changelog.md
              git log "$last_tag..HEAD" --oneline --no-decorate >> build/changelog.md
            else
              echo "# Initial pre-release" > build/changelog.md
            fi
            echo "" >> "build/appcast/release-notes-${TAG}.md"
            cat build/changelog.md >> "build/appcast/release-notes-${TAG}.md"
          else
            # Stable: require a heading for this version, and publish only that
            # section to the GitHub release body.
            if ! grep -q "^## ${VERSION}$" CHANGELOG.md; then
              echo "CHANGELOG.md has no '## ${VERSION}' heading."
              echo "Add a section to CHANGELOG.md with the heading '## ${VERSION}'."
              exit 1
            fi
            awk -v version="$VERSION" '
              /^## / {
                if (shown) exit
                shown = ($0 == "## " version)
                next
              }
              shown { print }
            ' CHANGELOG.md > build/changelog.md
          fi

          release_notes_url="${SITE_BASE_URL}/release-notes-${TAG}.md"
          full_release_notes_url="${SITE_BASE_URL}/changelog.md"
          echo "RELEASE_NOTES_URL=$release_notes_url" >> "$GITHUB_ENV"
          echo "FULL_RELEASE_NOTES_URL=$full_release_notes_url" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            "$ZIP_PATH#$ZIP_FILENAME" \
            "$ZIP_PATH_ARM64#$ZIP_FILENAME_ARM64" \
            --target "$RELEASE_SHA" \
            --title "$TITLE" \
            --notes-file build/changelog.md \
            $PRERELEASE_FLAG

      # The feed lives on the gh-pages branch (history = backups). Read the
      # branch tip directly rather than raw.githubusercontent.com, which is
      # CDN-cached and can serve a stale feed to back-to-back releases.
      - name: Fetch previous appcasts
        run: |
          set -euo pipefail
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          for f in appcast.xml appcast-arm64.xml; do
            git show "origin/gh-pages:${f}" > "build/appcast/${f}" \
              || echo "no ${f} on gh-pages yet"
          done

      - name: Update appcasts
        run: |
          set -euo pipefail

          python3 scripts/update_appcast.py \
            --appcast-path build/appcast/appcast.xml \
            --download-url "$DOWNLOAD_URL" \
            --title "$APPCAST_TITLE" \
            --short-version "$SHORT_VERSION" \
            --build-version "$RELEASE_BUILD_VERSION" \
            --signature "$SIGNATURE" \
            --length "$ED_LENGTH" \
            --release-notes-url "$RELEASE_NOTES_URL" \
            --full-release-notes-url "$FULL_RELEASE_NOTES_URL" \
            --channel "$CHANNEL"

          python3 scripts/update_appcast.py \
            --appcast-path build/appcast/appcast-arm64.xml \
            --download-url "$DOWNLOAD_URL_ARM64" \
            --title "$APPCAST_TITLE" \
            --short-version "$SHORT_VERSION" \
            --build-version "$RELEASE_BUILD_VERSION" \
            --signature "$SIGNATURE_ARM64" \
            --length "$ED_LENGTH_ARM64" \
            --release-notes-url "$RELEASE_NOTES_URL" \
            --full-release-notes-url "$FULL_RELEASE_NOTES_URL" \
            --channel "$CHANNEL" \
            --hardware-requirements arm64

      # Persist the feed to gh-pages. keep_files preserves previously published
      # release-notes-*.md files, which this run does not republish.
      - name: Deploy feed to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/appcast
          publish_branch: gh-pages
          keep_files: true

  # The site is built from one place (deploy-pages.yml); this job just points
  # it at the feed the build job just pushed.
  deploy-pages:
    name: Deploy Pages
    needs: build-release
    uses: ./.github/workflows/deploy-pages.yml
