name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, off-peak.
    - cron: "31 4 * * 1"
  workflow_dispatch:

# Advanced setup replaces the dynamic "CodeQL" job that default setup runs, so
# default setup has to be disabled (see the CodeQL analysis settings).

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  security-events: write
  # Required to fetch CodeQL packs on private repositories.
  packages: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Swift is deliberately excluded: CodeQL's Swift build tracer stalls
        # ~10 min on SwiftPM's package-resolution step under tracing
        # (github/codeql#22121), and the analysis reported nothing. Re-add a
        # `swift` entry with `build-mode: manual` if that changes.
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-latest
          - language: python
            build-mode: none
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
